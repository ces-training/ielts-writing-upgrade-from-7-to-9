<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Band 7 → 9 · IELTS Writing Lab</title>
<meta name="description" content="Luyện 26 kỹ thuật đưa bài IELTS Writing từ band 7 lên band 9, cho Task 1 và Task 2.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap" rel="stylesheet">
<style>
:root{--ink:#1b1e3c;--mut:#666a85;--bg:#f6f3ec;--card:#fff;--line:#e4e0d6;--b7:#f2a531;--b9:#12a37f;--acc:#3b3fd8;--bad:#d8453a;--r:14px}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 "Be Vietnam Pro",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
a{color:var(--acc);text-decoration:none}a:hover{text-decoration:underline}
h1,h2,h3,h4,h5{margin:0;line-height:1.25}p{margin:.5em 0}
.en{font-family:"Source Serif 4",Georgia,"Times New Roman",serif;font-size:1.06em;line-height:1.6}
.pre{white-space:pre-wrap}.small{font-size:.84em;color:var(--mut)}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--acc);outline-offset:2px}

/* khung */
.top{display:flex;align-items:center;gap:18px;padding:10px 20px;background:var(--ink);color:#fff;position:sticky;top:0;z-index:5;flex-wrap:wrap}
.top a{color:#fff}.brand{display:flex;align-items:center;gap:10px;font-weight:700}
.b79{display:inline-flex;align-items:center;gap:3px;padding:3px 9px;border-radius:99px;background:linear-gradient(90deg,var(--b7),var(--b9));color:#fff;font-weight:800}
.b79 i{font-style:normal;opacity:.85}.b79.big{font-size:2.2rem;padding:6px 20px}
.top nav{display:flex;gap:16px;font-size:.92em;flex:1;flex-wrap:wrap}.top nav a{opacity:.85}.top nav a:hover{opacity:1}
.who{display:flex;align-items:center;gap:10px;font-size:.9em}.hrs{background:rgba(255,255,255,.14);padding:3px 10px;border-radius:99px;font-variant-numeric:tabular-nums}
.link{background:none;border:0;color:#fff;text-decoration:underline;padding:0}
main{max-width:1000px;margin:0 auto;padding:22px 16px 60px}
footer{max-width:1000px;margin:0 auto;padding:0 16px 40px;color:var(--mut);font-size:.82em}
.crumbs{font-size:.86em;color:var(--mut);margin-bottom:14px}
.pt{font-size:1.7rem;margin-bottom:16px}.pt small{font-size:.5em;font-weight:500;color:var(--mut);margin-left:8px}

/* nút */
.btn{display:inline-flex;align-items:center;gap:6px;padding:10px 18px;border-radius:99px;border:2px solid var(--ink);background:#fff;color:var(--ink);font-weight:600;text-decoration:none!important;transition:transform .08s}
.btn:hover{transform:translateY(-1px)}.btn.primary{background:var(--ink);color:#fff}.btn.sm{padding:6px 12px;font-size:.88em;border-width:1.5px}
.btn.done{border-color:var(--b9);color:#0b7a5e;background:#e9f8f3}
.bar-actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}

/* đăng nhập */
.login{min-height:100vh;display:grid;place-items:center;padding:20px;background:radial-gradient(1200px 500px at 15% 0,#ffe7bd,transparent),radial-gradient(1000px 500px at 90% 100%,#c9f1e4,transparent),var(--bg)}
.login .card{background:#fff;border-radius:22px;padding:32px;max-width:440px;width:100%;box-shadow:0 18px 50px rgba(27,30,60,.14);text-align:center}
.login h1{margin:14px 0 4px}.login form{display:grid;gap:14px;margin:20px 0 10px;text-align:left}
label{display:grid;gap:5px;font-weight:600;font-size:.92em}.opt-l{font-weight:400;color:var(--mut)}
input:not([type=checkbox]),select,textarea{font:inherit;padding:11px 13px;border:2px solid var(--line);border-radius:10px;background:#fff;color:var(--ink);width:100%}
input:focus,select:focus,textarea:focus{border-color:var(--acc);outline:0}
.login .btn{justify-content:center}

/* trang chính */
.hero{display:grid;grid-template-columns:1fr auto;gap:24px;align-items:center;background:#fff;border-radius:22px;padding:28px;border:1px solid var(--line)}
.hero h1{font-size:1.55rem;margin:4px 0 10px;max-width:26em}.hi{color:var(--mut);margin:0}
.ring{width:150px;height:150px}.rv{font-size:26px;font-weight:800;fill:var(--ink)}.rs{font-size:11px;fill:var(--mut)}
.mods{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-top:18px}
.modcard{display:block;padding:24px;border-radius:22px;color:#fff!important;text-decoration:none!important;position:relative;overflow:hidden}
.modcard.t2{background:linear-gradient(135deg,#3b3fd8,#7b4fd6)}.modcard.t1{background:linear-gradient(135deg,#0f9a8a,#2f6fde)}
.modcard .me{font-size:2.2rem}.modcard h2{font-size:1.6rem}.modcard p{margin:.2em 0;opacity:.95}.modcard .small{color:#fff;opacity:.85}.modcard .cnt{font-weight:600;margin:10px 0}
.pbar{height:8px;border-radius:99px;background:rgba(27,30,60,.1);overflow:hidden;margin:8px 0}.pbar i{display:block;height:100%;border-radius:99px}
.modcard .pbar{background:rgba(255,255,255,.28)}.modcard .pbar i{background:#fff!important}

/* module và kỹ thuật */
.gh{margin:26px 0 12px;padding-left:12px;border-left:5px solid var(--c);font-size:1.05rem}
.tgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:14px}
.tcard{display:block;background:#fff;border:1px solid var(--line);border-top:5px solid var(--c);border-radius:var(--r);padding:16px;color:var(--ink)!important;text-decoration:none!important;transition:transform .1s,box-shadow .1s}
.tcard:hover{transform:translateY(-2px);box-shadow:0 8px 22px rgba(27,30,60,.1)}.tcard h4{margin:8px 0 4px}.tcard p{font-size:.9em;margin:.3em 0}
.code{display:inline-block;background:var(--c);color:#fff;font-weight:800;font-size:.78em;padding:3px 9px;border-radius:7px;letter-spacing:.03em}.code.sm{font-size:.7em;padding:2px 6px}
.thead,.phead{display:flex;align-items:center;gap:14px;margin-bottom:14px}.thead .code,.phead .code{font-size:1rem;padding:8px 12px}
.thead h1,.phead h1{font-size:1.45rem}.grp{margin:0;color:var(--mut);font-size:.9em}
.why3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.why3>div{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:14px}
.why3 h5{text-transform:uppercase;letter-spacing:.08em;font-size:.72em;color:var(--mut);margin-bottom:4px}.why3 p{margin:0;font-size:.93em}
.topgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px}
.topcard{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:14px}.te{font-size:1.6rem}.topcard h4{margin:4px 0 10px}.acts{display:flex;gap:6px;flex-wrap:wrap}

/* luyện */
.play{background:#fff;border:1px solid var(--line);border-radius:22px;padding:22px;border-top:6px solid var(--c)}
.clock{margin-left:auto;font-variant-numeric:tabular-nums;background:var(--bg);padding:5px 12px;border-radius:99px;font-size:.92em;white-space:nowrap}
.instr{font-weight:600;margin:14px 0 12px}
.tag{display:inline-block;font-size:.7em;font-weight:800;text-transform:uppercase;letter-spacing:.08em;padding:3px 9px;border-radius:6px;background:var(--ink);color:#fff}
.t7{background:var(--b7);color:#3a2500}.t9{background:var(--b9)}
.b7,.b9,.prompt{border-radius:var(--r);padding:12px 14px;margin:12px 0}.b7 p,.b9 p,.prompt p{margin:6px 0 0}
.b7{background:#fff6e3;border:1px solid #f6d79a}.b9{background:#e9f8f3;border:1px solid #a9e2d0}.prompt{background:#eef0ff;border:1px solid #cfd3fb}
.game{margin-top:8px}
.opts{display:grid;gap:10px}.opt{display:flex;gap:12px;align-items:flex-start;text-align:left;padding:13px 14px;border:2px solid var(--line);border-radius:var(--r);background:#fff}
.opt:hover{border-color:#b9bdd6}.opt.on{border-color:var(--acc);background:#eef0ff}.key{flex:none;width:26px;height:26px;border-radius:50%;background:var(--bg);display:grid;place-items:center;font-weight:800;font-size:.82em}
.opt.on .key{background:var(--acc);color:#fff}
.ok{border-color:var(--b9)!important;background:#e9f8f3!important}.bad{border-color:var(--bad)!important;background:#fdecea!important}
.gaptext{font-size:1.14em;line-height:2.3;margin:6px 0 14px}
.slot{min-width:92px;padding:3px 12px;border:2px dashed #b9bdd6;border-radius:9px;background:var(--bg);font:inherit;vertical-align:baseline;line-height:1.4}
.slot.filled{border-style:solid;background:#eef0ff;border-color:var(--acc)}.slot.cur{box-shadow:0 0 0 3px rgba(59,63,216,.22)}.slot.over{background:#dfe2ff}
.slot s{color:var(--bad);opacity:.8}
.bank,.pool,.buildline{display:flex;flex-wrap:wrap;gap:8px;padding:12px;border-radius:var(--r);background:var(--bg);min-height:56px;align-items:flex-start}
.chip{padding:8px 13px;border:2px solid var(--line);border-radius:11px;background:#fff;text-align:left;box-shadow:0 2px 0 var(--line)}
.chip:hover{border-color:#b9bdd6}.chip.on{border-color:var(--acc);background:#eef0ff;box-shadow:0 2px 0 var(--acc)}.chip.ghost{opacity:.3;box-shadow:none}.chip.dragging,.orow.dragging,.mrow.dragging{opacity:.4}
.corr{display:block;font-family:"Be Vietnam Pro",system-ui,sans-serif;font-size:.8em;color:#0b7a5e;font-weight:600;margin-top:3px}
.pool em,.buildline em{color:var(--mut);font-size:.9em}
.buckets{display:grid;gap:12px;margin-top:12px}.buckets.n2{grid-template-columns:1fr 1fr}.buckets.n3{grid-template-columns:repeat(3,1fr)}.buckets.n4{grid-template-columns:1fr 1fr}
.bucket{border:2px dashed #b9bdd6;border-radius:var(--r);padding:10px;min-height:110px;cursor:pointer}.bucket.over{background:#eef0ff;border-color:var(--acc)}
.bucket h4{font-size:.9em;margin-bottom:8px}.bucket .in{display:flex;flex-direction:column;gap:6px}
.buildline{background:#fff;border:2px dashed #b9bdd6;margin-bottom:12px;min-height:62px}.chip.inline{box-shadow:none;border-color:var(--acc);background:#eef0ff}
.match{display:grid;grid-template-columns:1fr 1fr;gap:14px}.col{display:grid;gap:8px;align-content:start}
.mrow{display:flex;gap:10px;align-items:flex-start;text-align:left;padding:11px 12px;border:2px solid var(--line);border-radius:var(--r);background:#fff;flex-wrap:wrap}
.mrow.on{border-color:var(--acc);background:#eef0ff}.mrow.paired{border-color:#9ea3e8}.mrow.over{background:#dfe2ff}
.num{flex:none;width:24px;height:24px;border-radius:50%;background:var(--bg);display:grid;place-items:center;font-weight:800;font-size:.8em}.paired .num{background:var(--acc);color:#fff}
.mrow .corr{flex-basis:100%}
.orderlist{display:grid;gap:8px}.orow{display:flex;gap:10px;align-items:center;padding:10px 12px;border:2px solid var(--line);border-radius:var(--r);background:#fff;cursor:grab}
.orow.over{border-color:var(--acc)}.grip{color:#b9bdd6;letter-spacing:-3px}.orow .en{flex:1}.arrows{display:flex;flex-direction:column;gap:3px}
.arrows button{border:1.5px solid var(--line);background:var(--bg);border-radius:7px;width:34px;height:24px;font-size:.7em;line-height:1}
.spot{font-size:1.14em;line-height:2.1}.tok{padding:2px 3px;border-radius:6px;cursor:pointer;border:2px solid transparent}.tok:hover{background:var(--bg)}
.tok.on{background:#fff0c9;border-color:var(--b7)}.tok.miss{background:#fff0c9;border-color:var(--b7)}.tok s{color:var(--bad)}.tok b{color:#0b7a5e}
.hunt{display:flex;gap:14px;align-items:center;font-weight:700;margin-bottom:6px}.cd{margin-left:auto;font-variant-numeric:tabular-nums;background:var(--ink);color:#fff;padding:3px 12px;border-radius:99px}.cd.hot{background:var(--bad)}
.fb{margin-top:18px;border-radius:var(--r);padding:16px;border:2px solid}.fb.ok{background:#f3fbf8}.fb.bad{background:#fff7f6}
.fbh{font-weight:800;font-size:1.1em}.fb.ok .fbh{color:#0b7a5e}.fb.bad .fbh{color:var(--bad)}.whyp{margin:.6em 0}.tip{font-size:.92em;color:var(--mut)}

/* viết */
textarea{min-height:230px;resize:vertical;font-family:"Source Serif 4",Georgia,serif;font-size:1.08em;line-height:1.65;margin-top:8px}
.wmeta{display:flex;justify-content:space-between;font-size:.88em;color:var(--mut);margin-top:4px}.wmeta .over{color:var(--bad);font-weight:600}
.ck{background:var(--bg);border-radius:var(--r);padding:12px 14px;margin-top:12px}.ck h5{margin-bottom:6px}.ck label{display:flex;gap:8px;font-weight:400;align-items:flex-start;margin:5px 0}
.ck input{margin-top:5px;width:16px;height:16px}
.hist{margin-top:18px}.past{border-top:1px solid var(--line);padding:8px 0}

/* dữ liệu task 1 */
.ds{background:var(--bg);border-radius:var(--r);padding:10px 14px;margin:8px 0 4px}.ds summary{font-weight:700;cursor:pointer;font-size:.93em}
.chart{width:100%;max-width:560px;display:block;margin:8px auto;background:#fff;border-radius:10px}.ax{font-size:11px;fill:#666a85}.lb{font-size:12px;font-weight:700}
.legend{display:flex;gap:16px;justify-content:center;font-size:.86em}.legend i,.sw{display:inline-block;width:11px;height:11px;border-radius:3px;margin-right:6px}
.dt{border-collapse:collapse;margin:8px auto;font-size:.88em;background:#fff;border-radius:8px;overflow:hidden}.dt th,.dt td{padding:5px 11px;border:1px solid var(--line);text-align:right;font-variant-numeric:tabular-nums}
.dt th:first-child{text-align:left}.dt.big{font-size:1em}.dt .tot{font-weight:700;background:#faf8f3}.dt.wide{width:100%;margin:0}.dt.wide td,.dt.wide th{text-align:left}
.tablewrap{overflow-x:auto;border-radius:var(--r);border:1px solid var(--line)}
.pies{display:flex;gap:26px;justify-content:center;flex-wrap:wrap}.pies figure{margin:6px 0;text-align:center}.pie{width:170px}.pv{font-size:12px;font-weight:700;fill:#fff}figcaption{font-weight:700;font-size:.9em}
.maps{display:grid;grid-template-columns:1fr 1fr;gap:14px}.maps figure{margin:6px 0}
.mapbox{display:grid;grid-template-columns:2fr 1fr;grid-template-areas:"n e" "c e" "r e" "s s";gap:5px;font-size:.84em;margin-top:5px}
.mapbox>div{padding:9px;border-radius:8px;background:#fff;border:1px solid var(--line);min-height:52px}.mapbox b{display:block;font-size:.72em;color:var(--mut)}
.mN{grid-area:n;background:#f4f8e4!important}.mC{grid-area:c}.mR{grid-area:r;background:#eceae4!important}.mS{grid-area:s;background:#e3f1fb!important}.mE{grid-area:e;background:#e2f3e6!important}
.flow{display:flex;flex-wrap:wrap;gap:8px;list-style:none;counter-reset:s;padding:0;margin:10px 0 4px}
.flow li{counter-increment:s;background:#fff;border:1px solid var(--line);border-radius:10px;padding:8px 10px;font-size:.86em;flex:1 1 200px;position:relative}
.flow li::before{content:counter(s);display:inline-grid;place-items:center;width:20px;height:20px;border-radius:50%;background:var(--ink);color:#fff;font-size:.78em;font-weight:700;margin-right:7px}

/* lộ trình, tiến độ, giới thiệu */
.planhead{display:grid;grid-template-columns:auto 1fr;gap:22px;align-items:center;background:#fff;border:1px solid var(--line);border-radius:22px;padding:22px}
.phases{display:grid;gap:10px;margin-top:16px}.phase{display:flex;gap:14px;background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:14px}
.pn{flex:none;width:34px;height:34px;border-radius:50%;background:linear-gradient(135deg,var(--b7),var(--b9));color:#fff;font-weight:800;display:grid;place-items:center}.pb{flex:1}.pb small{font-weight:500;color:var(--mut)}
.src{margin-top:16px}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:16px}.kpis>div{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:14px;text-align:center}
.kpis b{display:block;font-size:1.7rem}.kpis span{font-size:.84em;color:var(--mut)}
.about{background:#fff;border:1px solid var(--line);border-radius:22px;padding:22px}.about h3{margin-top:18px;font-size:1.02rem}.about h3:first-child{margin-top:0}

@media(max-width:720px){
  .hero,.planhead{grid-template-columns:1fr}.ringbox{justify-self:center}.mods,.why3,.maps{grid-template-columns:1fr}.kpis{grid-template-columns:1fr 1fr}
  .match{grid-template-columns:1fr}.buckets.n3,.buckets.n4,.buckets.n2{grid-template-columns:1fr}.top{position:static;gap:8px 14px;padding:8px 14px}.top nav{order:3;flex-basis:100%;gap:12px;font-size:.86em}.play{padding:16px}.clock{font-size:.82em}
}
@media(prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}

/* huấn luyện viên */
.coach h1{font-size:1.4rem}.dots{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px}
.dot{min-width:30px;height:30px;padding:0 10px;border-radius:99px;background:var(--bg);display:grid;place-items:center;font-size:.8em;font-weight:700;color:var(--mut)}
.dot.ok{background:#d6f3ea;color:#0b7a5e}.dot.cur{background:var(--ink);color:#fff}.dot.sk{background:#fff0c9;color:#8a5a00}
.lv{display:inline-block;padding:2px 9px;border-radius:99px;font-size:.78em;font-weight:800;white-space:nowrap}.l9{background:#d6f3ea;color:#0b7a5e}.l8{background:#dfe8ff;color:#2444b8}.l7{background:#ffe9c2;color:#8a5a00}
.est{display:flex;gap:16px;align-items:center;border-radius:var(--r);padding:14px 16px;margin:12px 0;border:2px solid}.est .big{font-size:1.7rem;font-weight:800;white-space:nowrap}.est .big small{font-size:.5em;display:block;font-weight:600}
.e9{background:#eefaf6;border-color:#a9e2d0}.e9 .big{color:#0b7a5e}.e8{background:#eff3ff;border-color:#c4d0fb}.e8 .big{color:#2444b8}.e7{background:#fff7e6;border-color:#f6d79a}.e7 .big{color:#8a5a00}
.feat td,.feat th{white-space:normal;vertical-align:top}.feat .gr td{font-weight:800;font-size:.82em;text-transform:uppercase;letter-spacing:.05em;background:#faf8f3;border-left:5px solid var(--c)}
.from-to{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:6px 0 10px}.finding{font-size:1.02em}
.sh{margin:18px 0 6px;text-transform:uppercase;letter-spacing:.07em;font-size:.74em;color:var(--mut)}
.mytext{background:var(--bg);border-radius:var(--r);padding:14px;max-height:340px;overflow:auto}mark{background:#ffd76e;border-radius:4px;padding:1px 2px;box-shadow:0 0 0 1px #e7b53a}
.fix{margin:0;padding-left:1.3em}.fix li{margin:5px 0}
.sugg{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}.sugg span{background:#eef0ff;border:1px solid #cfd3fb;border-radius:9px;padding:4px 10px;font-size:.86em}
.exd{margin-top:12px}.exd summary{cursor:pointer;font-weight:600;color:var(--acc)}
.scaf{background:#f3fbf8;border:1px dashed #a9e2d0;border-radius:var(--r);padding:12px 14px;margin-top:14px;display:grid;gap:8px}
.coach textarea{min-height:260px}
.ba{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:center}.ba .arrow{font-size:1.6rem;font-weight:800;color:var(--mut)}.ba .est{margin:4px 0}
.aibox{border:2px solid #cfd3fb;background:#f6f7ff;border-radius:var(--r);padding:12px 14px;margin:12px 0}.aib{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}
.aib span{background:#fff;border:1px solid #cfd3fb;border-radius:10px;padding:5px 12px;font-size:.78em;text-align:center}.aib b{display:block;font-size:1.5em}.aib .ov{background:var(--ink);color:#fff;border-color:var(--ink)}
.seg{display:flex;gap:14px;align-items:center;flex-wrap:wrap;margin:10px 0}.seg label{display:flex;gap:6px;align-items:center}.seg select{width:auto}#cf{display:grid;gap:12px}
@media(max-width:720px){.ba{grid-template-columns:1fr}.ba .arrow{justify-self:center;transform:rotate(90deg)}.est{flex-direction:column;align-items:flex-start;gap:6px}}

/* hai chế độ: miễn phí và trả phí */
.modes{display:grid;grid-template-columns:1fr 1.4fr;gap:12px;margin-top:22px}.mode{border:2px solid var(--line);border-radius:var(--r);padding:14px}.mode h4{margin:8px 0 4px}.mode p{margin:.3em 0;font-size:.93em}
.mode.free{background:var(--bg)}.mode.pay{border-color:#a9e2d0;background:#f3fbf8}
.fee{margin:10px 0!important}.fee b{font-size:1.5rem}.fee .small{display:block}.payon{font-weight:600;color:#0b7a5e}
.payform{display:grid;gap:10px;margin-top:14px;padding-top:14px;border-top:1px dashed #a9e2d0}.tot b{font-size:1.25rem}.btn[disabled]{opacity:.45;cursor:not-allowed}
@media(max-width:720px){.modes{grid-template-columns:1fr}}
.modes-h{margin:26px 0 0;font-size:1.05rem}.modes{margin-top:12px;grid-template-columns:1fr 1.25fr}

{"id":"b341","tp":"env","ty":"two","q":"Despite the moral quagmire detailed above, I believe animal testing does enough to advance medical testing to warrant its use. Some cursory research will reveal the importance of animal testing in fields such as diabetic medicine, cancer research, experimental surgery, and stem cells. Testing insulin for diabetics on dogs may be the most well-known example of this kind of impactful research. Many other advances in medicine often attributed to animal testing have saved countless human lives to an extent that would be impossible if researchers were working under the moral constraints of human test subjects.","d":[],"ms":[]},
{"id":"b342","tp":"env","ty":"two","q":"Detractors of animal testing often point out that animals have rights. We would never condone this type of testing on a human, even with one with a low IQ and it follows that we should treat animals with some measure of respect. The strongest argument supporting this is the level of cruelty involved in animal testing. Many drugs that are tested on animals have painful side-effects and the test subjects may die slow, painful deaths. This is undeniably unjustifiable regarding testing in non-essential medical fields such as cosmetics.","d":[],"ms":[]},

      $$("[data-a]", box).forEach(b => b.onclick = () => { if (locked) return; line.push(+b.dataset.a); draw(); });

      check() { locked = true; const ok = line.length === it.c.length && line.every((x, i) => it.c[x] === it.c[i]); $(".buildline", box).classList.add(ok ? "ok" : "bad"); return ok; },
      auto() { line = it.c.map((_, i) => i); draw(); }

  G.spot = (it, box, api) => {
    const toks = []; const parts = it.s.split(/\{([^|}]*)\|([^}]*)\}/);
    for (let i = 0; i < parts.length; i += 3) {
      (parts[i].match(/\S+/g) || []).forEach(w => toks.push({ t: w }));
      if (i + 1 < parts.length) toks.push({ t: parts[i + 1], r: parts[i + 2], err: true });
    }
    const nErr = toks.filter(t => t.err).length; let sel = [], locked = false, left = it.y === "hunt" ? (it.sec || 120) : 0, timer = null;
    const glue = t => /^[,.;:!?]/.test(t.t) ? "" : " ";

    return {
      check() {
        locked = true; if (timer) clearInterval(timer); let ok = true;

  function chart(ds) {
    if (!ds) return "";

    if (ds.kind === "line" || ds.kind === "bar") {
      const W = 560, H = 270, L = 38, R = ds.kind === "line" ? 62 : 12, T = 14, B = 34, iw = W - L - R, ih = H - T - B;
      const max = Math.max.apply(null, ds.series.map(s => Math.max.apply(null, s.v))); const step = max > 40 ? 20 : 5; const top = Math.ceil(max / step) * step;
      const y = v => T + ih - (v / top) * ih;
      let g = "";
      for (let v = 0; v <= top; v += step) g += `<line x1="${L}" x2="${W - R}" y1="${y(v)}" y2="${y(v)}" stroke="#e4e0d6"/><text x="${L - 6}" y="${y(v) + 4}" text-anchor="end" class="ax">${v}</text>`;
      if (ds.kind === "line") {
        const x = i => L + (i / (ds.x.length - 1)) * iw;
        ds.x.forEach((lb, i) => { g += `<text x="${x(i)}" y="${H - 10}" text-anchor="middle" class="ax">${esc(lb)}</text>`; });
        ds.series.forEach((s, si) => {
          g += `<polyline fill="none" stroke="${PAL[si]}" stroke-width="2.5" stroke-dasharray="${["", "7 4", "2 4"][si]}" points="${s.v.map((v, i) => x(i) + "," + y(v)).join(" ")}"/>`;
          s.v.forEach((v, i) => { g += `<circle cx="${x(i)}" cy="${y(v)}" r="3.5" fill="${PAL[si]}"/>`; });
          g += `<text x="${W - R + 8}" y="${y(s.v[s.v.length - 1]) + 4}" class="lb" fill="${PAL[si]}">${esc(s.n)}</text>`;
        });
      } else {
        const gw = iw / ds.x.length, bw = Math.min(34, (gw - 18) / ds.series.length);
        ds.x.forEach((lb, i) => {
          g += `<text x="${L + gw * i + gw / 2}" y="${H - 10}" text-anchor="middle" class="ax">${esc(lb)}</text>`;
          ds.series.forEach((s, si) => { const bx = L + gw * i + gw / 2 - (bw * ds.series.length) / 2 + bw * si; g += `<rect x="${bx}" y="${y(s.v[i])}" width="${bw - 3}" height="${T + ih - y(s.v[i])}" fill="${PAL[si]}" rx="2"/><text x="${bx + (bw - 3) / 2}" y="${y(s.v[i]) - 4}" text-anchor="middle" class="ax">${s.v[i]}</text>`; });
        });
      }
      h += `<svg viewBox="0 0 ${W} ${H}" class="chart" role="img" aria-label="${esc(ds.title)}">${g}</svg>`;
      if (ds.kind === "bar") h += '<div class="legend">' + ds.series.map((s, si) => `<span><i style="background:${PAL[si]}"></i>${esc(s.n)}</span>`).join("") + "</div>";
      h += '<table class="dt"><tr><th></th>' + ds.x.map(x => `<th>${esc(x)}</th>`).join("") + "</tr>" + ds.series.map(s => `<tr><th>${esc(s.n)}</th>${s.v.map(v => `<td>${v}</td>`).join("")}</tr>`).join("") + "</table>";
    } else if (ds.kind === "pie") {
      h += '<div class="pies">' + ds.series.map(s => {
        let a = -Math.PI / 2, g = "";
        s.v.forEach((v, i) => {
          const b = a + (v / 100) * 2 * Math.PI, big = b - a > Math.PI ? 1 : 0, m = (a + b) / 2;
          g += `<path d="M90 90 L${90 + 80 * Math.cos(a)} ${90 + 80 * Math.sin(a)} A80 80 0 ${big} 1 ${90 + 80 * Math.cos(b)} ${90 + 80 * Math.sin(b)} Z" fill="${PAL[i]}" stroke="#fff" stroke-width="2"/>`;
          if (v >= 10) g += `<text x="${90 + 52 * Math.cos(m)}" y="${90 + 52 * Math.sin(m) + 4}" text-anchor="middle" class="pv">${v}%</text>`;
          a = b;
        });
        return `<figure><svg viewBox="0 0 180 180" class="pie" role="img" aria-label="${esc(s.n)}">${g}</svg><figcaption>${esc(s.n)}</figcaption></figure>`;
      }).join("") + "</div>";
      h += '<table class="dt"><tr><th></th>' + ds.series.map(s => `<th>${esc(s.n)}</th>`).join("") + "</tr>" + ds.x.map((x, i) => `<tr><th><i class="sw" style="background:${PAL[i]}"></i>${esc(x)}</th>${ds.series.map(s => `<td>${s.v[i] ? s.v[i] + "%" : "–"}</td>`).join("")}</tr>`).join("") + "</table>";
    } else if (ds.kind === "table") {
      h += '<table class="dt big"><tr>' + ds.head.map(x => `<th>${esc(x)}</th>`).join("") + "</tr>" + ds.rows.map(r => `<tr${r[0] === "Total" || r[0] === "All modes" ? ' class="tot"' : ""}><th>${esc(r[0])}</th>${r.slice(1).map(c => `<td>${esc(c)}</td>`).join("")}</tr>`).join("") + "</table>";
    } else if (ds.kind === "map") {
      h += '<div class="maps">' + ds.maps.map(m => `<figure><figcaption>${esc(m.n)}</figcaption><div class="mapbox"><div class="mN"><b>N ↑</b>${esc(m.N)}</div><div class="mC">${esc(m.C)}</div><div class="mR">${esc(m.R)}</div><div class="mS"><b>S ↓</b>${esc(m.S)}</div><div class="mE"><b>E →</b>${esc(m.E)}</div></div></figure>`).join("") + "</div>";
    } else if (ds.kind === "process") {
      h += '<ol class="flow">' + ds.steps.map(s => `<li>${esc(s)}</li>`).join("") + "</ol>";
    }
    return `<details class="ds" open><summary>Dữ liệu đề · ${esc(ds.title)}</summary>${h}</details>`;
  }

      </div>
    </div>
    <p class="g-go">Luyện: <a href="#/k/TR1">TR1 Thang “Vì sao – Thì sao”</a> · <a href="#/k/TR2">TR2 Phản đề – phản bác khớp</a> · <a href="#/k/TR3">TR3 Chẩn đoán lỗ hổng lập luận</a> · <a href="#/k/TR4">TR4 Ví dụ có địa chỉ</a></p>
  </section>

  <section id="g-2" style="--c:#2f6fde">
    <h3><span class="g-n">2</span>Liên kết: band 7 dán nhãn đầu câu, band 9 nối bằng nội dung</h3>
    <p>Band 9 yêu cầu liên kết <span class="en">“attracts no attention”</span>: người đọc đi từ câu này sang câu kia mà không để ý mình được dẫn đi. Các nghiên cứu về phương tiện liên kết cũng chỉ ra cùng hướng: có nhiều từ nối không làm bài mạch lạc hơn, còn quy chiếu ngược về câu trước và đoạn trước thì đi cùng bài chất lượng cao.</p>
    <div class="g-pair">
      <div class="b7"><span class="tag t7">Đặc trưng band 7</span>
        <p class="en"><span class="hc">Firstly,</span> remote work saves time. <span class="hc">Moreover,</span> it reduces costs. <span class="hc">Furthermore,</span> employees are happier.</p>
        <p class="g-note">Ba câu rời nhau. Đổi chỗ câu 1 và câu 3, đoạn vẫn đọc được: các câu chưa nối với nhau.</p>
      </div>
      <div class="b9"><span class="tag t9">Đặc trưng band 9</span>
        <p class="en">Remote work removes the daily commute. <span class="hr">The hours this frees up</span> can be reinvested in work or rest, and the savings on transport and office space benefit employees and employers alike. <span class="hr">Such gains</span> help explain why remote staff often report higher satisfaction.</p>
        <p class="g-note">Mỗi câu mở đầu bằng thứ câu trước vừa nói. Đổi chỗ hai câu bất kỳ thì đoạn hỏng.</p>
      </div>
    </div>
    <div class="g-box">
      <p><b>Phép thử đảo câu.</b> Lấy một đoạn bạn đã viết, đổi chỗ hai câu bất kỳ. Nếu đoạn vẫn ổn, từ nối của bạn đang làm thay việc của nội dung.</p>
      <p><b>Giữa các đoạn cũng vậy.</b> Thay vì mở đoạn 2 bằng <span class="en">On the other hand,</span> hãy nhặt lại ý đoạn 1 rồi mới rẽ: <span class="en">While <span class="hr">these economic gains</span> are real, they are rarely shared evenly among local residents.</span></p>
    </div>
    <p class="g-go">Luyện: <a href="#/k/CC1">CC1 Xóa từ nối</a> · <a href="#/k/CC2">CC2 Chuỗi quy chiếu</a> · <a href="#/k/CC3">CC3 Cầu nối giữa đoạn</a></p>
  </section>

  <section id="g-3" style="--c:#7b4fd6">
    <h3><span class="g-n">3</span>Từ vựng: band 7 tìm từ hiếm, band 9 kết hợp từ chính xác</h3>
    <p>Đây là chỗ nhiều người học đi sai hướng nhất. Nghiên cứu trên bài viết từ B2 đến C2 cho thấy độ hiếm của từ không phân biệt được các trình độ cao; thứ phân biệt được là <b>collocation</b>, rõ nhất ở cặp động từ + danh từ.</p>
    <div class="g-three">
      <div class="b7"><span class="tag t7">Band 7: chung chung</span><p class="en">Public transport is a good way to solve traffic jams.</p></div>
      <div class="g-bad"><span class="tag">Cố dùng từ hiếm</span><p class="en">Public transport is a panacea to ameliorate the plethora of traffic conundrums.</p><p class="g-note">Từ hiếm nhưng không đi với nhau; đọc lên thấy gượng và điểm còn thấp hơn câu bên trái.</p></div>
      <div class="b9"><span class="tag t9">Band 9: chính xác</span><p class="en">Public transport eases congestion.</p><p class="g-note">Ngắn hơn câu gốc. Không có từ nào hiếm.</p></div>
    </div>
    <div class="tablewrap g-tw"><table class="dt wide">
      <tr><th>Band 7 hay viết</th><th>Kết hợp chính xác</th></tr>
      <tr><td class="en">make a problem worse</td><td class="en">exacerbate a problem</td></tr>
      <tr><td class="en">give a solution</td><td class="en">propose a solution</td></tr>
      <tr><td class="en">make the gap smaller</td><td class="en">narrow the gap</td></tr>
      <tr><td class="en">learn knowledge</td><td class="en">acquire knowledge</td></tr>
      <tr><td class="en">cause a bad effect to</td><td class="en">have a detrimental effect on</td></tr>
    </table></div>
    <p>Dấu hiệu bạn đang đi đúng: câu sau khi sửa <b>ngắn hơn hoặc bằng</b> câu gốc. Nếu nó dài ra, bạn đang trang trí chứ chưa chính xác hơn.</p>
    <p class="g-go">Luyện: <a href="#/k/LR1">LR1 Lưới collocation</a> · <a href="#/k/LR2">LR2 Nâng cấp động từ + danh từ</a> · <a href="#/k/LR3">LR3 Sửa collocation sai</a></p>
  </section>

  <section id="g-4" style="--c:#0f9a8a">
    <h3><span class="g-n">4</span>Ngữ pháp: band 7 nối thêm mệnh đề, band 9 nén vào cụm danh từ và không sai</h3>
    <p>Có hai khác biệt, và chúng kéo về hai hướng ngược nhau nên phải luyện cùng lúc.</p>
    <p><b>Thứ nhất, độ phức tạp chuyển từ mệnh đề sang cụm từ.</b> Người học thường hiểu “câu phức” là thêm <span class="en">because, which, although</span>. Viết học thuật ở trình độ cao lại dựa nhiều vào danh hóa và bổ nghĩa danh từ: cùng lượng thông tin, ít mệnh đề hơn.</p>
    <figure class="g-fig">
      <figcaption>Cùng một thông tin: hai mệnh đề nén thành một mệnh đề</figcaption>
      <div class="g-clauses">
        <div><span class="tag t7">Band 7 · 2 mệnh đề</span><p class="en"><span class="g-cl">Because the population is ageing rapidly,</span> <span class="g-cl">the government spends more on healthcare.</span></p></div>
        <div><span class="tag t9">Band 9 · 1 mệnh đề</span><p class="en"><span class="g-cl g-np">The rapid ageing of the population</span> has driven up <span class="g-cl g-np">public healthcare spending</span>.</p><p class="g-note">Hai ô xanh là hai cụm danh từ; cả câu chỉ còn một động từ chính.</p></div>
      </div>
    </figure>
    <p><b>Thứ hai, độ chính xác.</b> Band 7 được mô tả là có <span class="en">“frequent error-free sentences”</span>, tức vẫn còn câu có lỗi. Ở band 9, lỗi chỉ còn là sơ suất hiếm gặp (<span class="en">“slips”</span>). Vì vậy thử một cấu trúc khó mà viết sai thì mất điểm chứ không được điểm.</p>
    <div class="g-pair">
      <div class="b7"><span class="tag t7">Cấu trúc khó, viết sai</span><p class="en">Not only public transport <s>reduce</s> <s>the</s> pollution, but also it <s>help</s> <s>the</s> poor people.</p><p class="g-note">Thiếu đảo ngữ sau <span class="en">Not only</span>, hai lỗi hòa hợp chủ–vị, hai mạo từ thừa.</p></div>
      <div class="b9"><span class="tag t9">Cấu trúc vừa sức, không lỗi</span><p class="en">Public transport reduces pollution and is affordable for people on low incomes.</p></div>
    </div>
    <p>Mỗi đoạn thân bài chỉ cần một, hai câu nén. Nén mọi câu làm bài khó đọc.</p>
    <p class="g-go">Luyện: <a href="#/k/GR1">GR1 Nén thành cụm danh từ</a> · <a href="#/k/GR2">GR2 Một ý, ba cấu trúc</a> · <a href="#/k/GR3">GR3 Câu không lỗi</a></p>
  </section>

  <section id="g-5" style="--c:#d6418a">
    <h3><span class="g-n">5</span>Giọng văn: band 7 khẳng định và kêu gọi, band 9 cân nhắc và phân tích</h3>
    <p>Phân tích bài thi điểm cao cho thấy chúng ít dấu hiệu thân mật, nhiều bị động, danh hóa và cách nói giảm mức khẳng định hơn. Giọng hô hào (câu hỏi tu từ, <span class="en">we must</span>) thường mang sang từ thói quen viết tiếng mẹ đẻ.</p>
    <figure class="g-fig">
      <figcaption>Thang mức khẳng định. Chọn mức khớp với bằng chứng bạn có trong bài.</figcaption>
      <ol class="g-scale">
        <li class="s1"><b>Tuyệt đối</b><span class="en">Social media always causes depression in teenagers.</span></li>
        <li class="s2"><b>Mạnh</b><span class="en">Social media causes depression in teenagers.</span></li>
        <li class="s3"><b>Vừa đủ</b><span class="en">Heavy social media use is associated with higher rates of depression among teenagers.</span></li>
        <li class="s4"><b>Quá yếu</b><span class="en">Social media might possibly have some effect on some teenagers.</span></li>
      </ol>
      <p class="g-note">Mục tiêu là mức 3, không phải mức 4. Câu nêu lập trường của bạn vẫn phải rõ; rào đón mọi câu thì bài mất quan điểm.</p>
    </figure>
    <div class="g-pair">
      <div class="b7"><span class="tag t7">Hô hào</span><p class="en">How can we let our children suffer like this? We must act now!</p></div>
      <div class="b9"><span class="tag t9">Phân tích</span><p class="en">The risks to children are serious enough to justify immediate regulation.</p></div>
    </div>
    <p class="g-go">Luyện: <a href="#/k/ST1">ST1 Thang hedging</a> · <a href="#/k/ST2">ST2 Từ hô hào sang phân tích</a></p>
  </section>

  <section id="g-6" style="--c:#c7801a">
    <h3><span class="g-n">6</span>Quy trình: band 7 viết theo cảm tính, band 9 có kế hoạch và có lượt soát</h3>
    <p>Năm khác biệt trên không tự xuất hiện trong 40 phút nếu bạn bắt đầu viết ngay. Nghiên cứu về lập kế hoạch cho thấy dàn ý trước khi viết làm ý và độ phức tạp tốt lên, nhưng <b>ít tác động đến độ chính xác</b>. Độ chính xác cần một bước riêng: soát bài.</p>
    <figure class="g-fig">
      <figcaption>40 phút của Task 2</figcaption>
      <div class="g-time"><span class="g-tl">Viết cảm tính</span><span class="g-tb"><i style="flex:38;background:var(--b7);color:#3a2500">Viết ngay · 38 phút</i><i style="flex:2;background:#e4e0d6" title="Đọc lại một lượt, 2 phút"></i></span></div>
      <div class="g-time"><span class="g-tl">Có kiểm soát</span><span class="g-tb"><i style="flex:5;background:#3b3fd8">5</i><i style="flex:31;background:var(--b9)">Viết · 31 phút</i><i style="flex:4;background:#1b1e3c">4</i></span></div>
      <p class="g-note">5 phút dàn ý có cả ô ngôn ngữ (collocation và cấu trúc định dùng) · 31 phút viết · 4 phút soát ba lượt, mỗi lượt chỉ tìm một thứ: lỗi cá nhân hay gặp → từ nối thừa và đại từ mơ hồ → nhận định tuyệt đối.</p>
    </figure>
    <p class="g-go">Luyện: <a href="#/k/PR1">PR1 Dàn ý 5 phút có ô ngôn ngữ</a> · <a href="#/k/PR2">PR2 Soát bài có giới hạn thời gian</a> · <a href="#/k/F2">F2 Bài Task 2 hoàn chỉnh</a></p>
  </section>

  <section id="g-7" style="--c:#0f9a8a">
    <h3><span class="g-n">7</span>Task 1: band 7 kể hết số liệu theo khuôn, band 9 chọn lọc và nêu quy luật</h3>
    <p>Nghiên cứu về Task 1 cho thấy điểm phụ thuộc vào năng lực viết nhiều hơn là độ quen với biểu đồ, và dạng bài này rất dễ luyện theo khuôn. Khuôn đủ để đạt band 7, và cũng là trần của band 7. Ba phản xạ cần đổi: overview nêu quy luật thay vì nhắc lại con số, thân bài chọn và so sánh thay vì kể lần lượt, và <b>không giải thích nguyên nhân</b> (thói quen tốt ở Task 2 nhưng bị trừ điểm ở Task 1).</p>
    <figure class="g-fig">
      <figcaption>Dữ liệu luyện tập của trang: số lượt đi lại ở Newport, 2000–2020 (triệu lượt mỗi năm)</figcaption>
      <svg class="g-chart" viewBox="0 0 470 230" role="img" aria-label="Biểu đồ đường: xe buýt giảm từ 60 xuống 35, metro tăng từ 20 lên 70, tram dao động quanh 14 đến 18 triệu lượt">
        <g stroke="#e4e0d6" stroke-width="1"><line x1="40" y1="190" x2="390" y2="190"/><line x1="40" y1="150" x2="390" y2="150"/><line x1="40" y1="110" x2="390" y2="110"/><line x1="40" y1="70" x2="390" y2="70"/><line x1="40" y1="30" x2="390" y2="30"/></g>
        <g class="ax" text-anchor="end"><text x="34" y="194">0</text><text x="34" y="154">20</text><text x="34" y="114">40</text><text x="34" y="74">60</text><text x="34" y="34">80</text></g>
        <g class="ax" text-anchor="middle"><text x="50" y="208">2000</text><text x="135" y="208">2005</text><text x="220" y="208">2010</text><text x="305" y="208">2015</text><text x="390" y="208">2020</text></g>
        <polyline fill="none" stroke="#3b3fd8" stroke-width="3" points="50,150 135,130 220,100 305,74 390,50"/>
        <polyline fill="none" stroke="#c7801a" stroke-width="3" stroke-dasharray="8 5" points="50,70 135,80 220,94 305,110 390,120"/>
        <polyline fill="none" stroke="#666a85" stroke-width="3" stroke-dasharray="2 5" stroke-linecap="round" points="50,160 135,154 220,162 305,156 390,158"/>
        <g class="lb"><text x="398" y="54" fill="#3b3fd8">Metro 70</text><text x="398" y="124" fill="#8a5a10">Bus 35</text><text x="398" y="162" fill="#555a7a">Tram 16</text></g>
        <g class="ax"><text x="50" y="62" text-anchor="middle">60</text><text x="50" y="142" text-anchor="middle">20</text><text x="50" y="176" text-anchor="middle">15</text></g>
      </svg>
    </figure>
    <div class="g-pair">
      <div class="b7"><span class="tag t7">Đặc trưng band 7</span>
        <p class="en">Overall, the number of bus journeys <span class="ha">decreased from 60 million to 35 million</span>, while metro journeys <span class="ha">increased from 20 million to 70 million</span>. The number of tram journeys was 15 million in 2000, 18 million in 2005, 14 million in 2010, 17 million in 2015 and 16 million in 2020. <span class="ha">The metro became more popular because it is faster and more modern than the bus.</span></p>
        <p class="g-note">Overview nhắc lại con số · kể đủ năm mốc của tram theo khuôn <span class="en">“the number of … was …”</span> · câu cuối suy diễn nguyên nhân không có trong biểu đồ.</p>
      </div>
      <div class="b9"><span class="tag t9">Đặc trưng band 9</span>
        <p class="en">Overall, the metro grew steadily to become the city's most heavily used form of transport, whereas bus travel declined throughout the period. Tram use, by contrast, changed very little.</p>
        <p class="en">Having started at 20 million, metro journeys <span class="hk">more than doubled</span> to 45 million by 2010, overtook the bus shortly afterwards and reached 70 million in 2020, <span class="hk">exactly twice the bus figure</span>.</p>
        <p class="g-note">Overview không có con số, chỉ có quy luật · số liệu được chọn và đặt vào phép so sánh · mỗi phép so sánh khớp đúng số (45 &gt; 2 × 20; 70 = 2 × 35).</p>
      </div>
    </div>
    <p class="g-go">Luyện: <a href="#/k/TA1">TA1 Chọn và nhóm dữ liệu</a> · <a href="#/k/TA2">TA2 Overview không có con số</a> · <a href="#/k/TA3">TA3 So sánh và định lượng chính xác</a> · <a href="#/k/TA4">TA4 Một dữ liệu, nhiều cách viết</a> · <a href="#/k/TA5">TA5 Mô tả, không suy diễn</a></p>
  </section>

  <section id="g-8">
    <h3>Tóm tắt: bảy khác biệt và chỗ luyện</h3>
    <div class="tablewrap g-tw"><table class="dt wide feat">
      <tr><th></th><th>Band 7</th><th>Band 9</th><th>Luyện ở</th></tr>
      <tr><td><b>Ý</b></td><td>Hai, ba ý mỗi đoạn, mỗi ý một câu; hay khái quát hóa</td><td>Một ý mỗi đoạn, đi đủ bốn bậc; phản bác khớp phản đề</td><td><a href="#/k/TR1">TR1</a>–<a href="#/k/TR4">TR4</a></td></tr>
      <tr><td><b>Liên kết</b></td><td>Từ nối đứng đầu gần như mọi câu</td><td>Quy chiếu về câu trước, đoạn trước; rất ít từ nối đầu câu</td><td><a href="#/k/CC1">CC1</a>–<a href="#/k/CC3">CC3</a></td></tr>
      <tr><td><b>Từ vựng</b></td><td>Động từ chung chung, hoặc từ hiếm dùng gượng</td><td>Collocation chính xác, nhất là động từ + danh từ</td><td><a href="#/k/LR1">LR1</a>–<a href="#/k/LR3">LR3</a></td></tr>
      <tr><td><b>Ngữ pháp</b></td><td>Nối thêm mệnh đề; còn câu có lỗi</td><td>Nén vào cụm danh từ; lỗi chỉ là sơ suất hiếm gặp</td><td><a href="#/k/GR1">GR1</a>–<a href="#/k/GR3">GR3</a></td></tr>
      <tr><td><b>Giọng văn</b></td><td>Khẳng định tuyệt đối, kêu gọi</td><td>Mức khẳng định vừa đủ, giọng phân tích</td><td><a href="#/k/ST1">ST1</a>–<a href="#/k/ST2">ST2</a></td></tr>
      <tr><td><b>Quy trình</b></td><td>Viết ngay, đọc lại một lượt</td><td>Dàn ý có ô ngôn ngữ, soát ba lượt</td><td><a href="#/k/PR1">PR1</a>–<a href="#/k/PR2">PR2</a></td></tr>
      <tr><td><b>Task 1</b></td><td>Kể số liệu theo khuôn, suy diễn nguyên nhân</td><td>Chọn lọc, overview nêu quy luật, so sánh khớp số</td><td><a href="#/k/TA1">TA1</a>–<a href="#/k/TA5">TA5</a></td></tr>
    </table></div>
    <div class="g-box g-honest">
      <p><b>Ba điều cần nói rõ.</b></p>
      <p>Gần như không có nghiên cứu nào đo trực tiếp chặng band 7 lên band 9: các nghiên cứu dùng bài thi IELTS thật thường dừng ở band 7 hoặc 8. Bài này ghép hai nguồn, nghiên cứu IELTS ở band cao nhất có dữ liệu và nghiên cứu về viết ngoại ngữ từ B2 đến C2; phần áp vào chặng 7 lên 9 là suy luận của nhóm soạn.</p>
      <p>Các câu và đoạn mẫu ở trên do nhóm soạn viết để minh họa. Nhãn “band 7” và “band 9” là ước lượng theo band descriptor công khai, không phải điểm do giám khảo chấm.</p>
      <p>Không có một đặc điểm đơn lẻ nào làm nên band 9. Bài tốt là tổng hòa của cả bảy điểm, nên sau khi luyện từng kỹ thuật, bạn cần viết cả bài.</p>

        <div class="bar-actions"><button class="btn" id="again">↻ Làm lại</button><a class="btn" href="#/w/${id}${byT ? "/t" : ""}">✎ Viết với kỹ thuật này</a>${byT ? (nxtT ? `<a class="btn primary" href="#/p/${nxtT.k}/${tk}/t">Kỹ thuật tiếp: ${esc(nxtT.n)} →</a>` : `<a class="btn primary" href="#/w/${FULLK(t.m)}/${tk}/t">Xong chủ đề. Viết cả bài →</a>`) : nxt ? `<a class="btn primary" href="#/p/${t.k}/${nxt.k}">Bài tiếp: ${esc(nxt.n)} →</a>` : `<a class="btn primary" href="#/k/${t.k}">Xong ${t.k} →</a>`}</div></div>`;
      $("#again").onclick = () => vPlay(k, tk, via);
      sessDone++; fbMount($("#fb"), { tech: t.k, topic: tk, src: "item" });
      $("#fb").scrollIntoView({ behavior: "smooth", block: "nearest" });
    };
    game = G[it.y](it, $("#game"), { submit });
    $("#check").onclick = submit;
  }

  /* ---------- trang viết (studio) ---------- */
  function refModel(t, tk) {
    if (t.k === "F1") return { label: "Bài mẫu để đối chiếu", text: D.models[tk] };
    if (t.m === "t2") { const p = ITEM["TR1/" + tk]; const own = ITEM[t.k + "/" + tk]; if (t.k === "TR1" || t.g === "FULL" || !own || !model(own)) return p ? { label: "Đoạn thân bài mẫu cùng chủ đề", text: model(p) } : null; return { label: "Câu band 9 cùng kỹ thuật", text: model(own) }; }
    const own = ITEM[t.k + "/" + tk]; if (own && model(own)) return { label: "Câu band 9 cùng kỹ thuật", text: model(own) };
    return D.models[tk] ? { label: "Bài mẫu để đối chiếu", text: D.models[tk] } : null;
  }
  function vWrite(k, tk, via, bk) {
    const t = TECH[k]; let tp = TOPIC[tk];
    if (bk) { const base = TOPIC[bk.tp] || XTOPIC[bk.tp]; tk = bk.tp; tp = { k: bk.tp, n: base.n, e: base.e, q: bk.q }; }
    if (!t || !tp || (!bk && D.topics[t.m].indexOf(tp) < 0)) return vHome();
    const byT = via === "t", fo = t.g === "FULL" && via && TECH[via] && TECH[via].m === t.m && TECH[via].g !== "FULL" ? TECH[via] : null;
    const cks = fo ? t.ck.concat(fo.ck) : t.ck, back = byT ? "#/t/" + tk : fo ? "#/k/" + fo.k : "#/k/" + t.k;
    const M = D.modules[t.m], id = k + "/" + (bk ? bk.id : tk), prev = S.wr[id] || [], draft = S.draft[id] != null ? S.draft[id] : (t.tpl || "");
    shell(`<div class="play studio" style="--c:${color(t)}"><div class="phead"><span class="code">${t.k}</span><div><h1>Viết: ${esc(t.n)}</h1><p class="grp">${tp.e} ${esc(tp.n)} · gợi ý ${t.min} phút</p></div><span class="clock">⏱ <b id="clock">0:00</b></span></div>
      <p class="instr">${esc(t.st)}</p>
      ${fo ? `<div class="focus" style="--c:${color(fo)}"><span class="code sm" style="--c:${color(fo)}">${fo.k}</span><div><b>Trọng tâm của bài này: ${esc(fo.n)}</b><p>${esc(fo.goal)}</p><p class="small">${esc(fo.tip)}</p></div></div>` : ""}
      <div class="prompt"><span class="tag">Đề bài</span>${bk ? ` <span class="btags">${bankTags(bk)}</span>` : ""}<p class="en">${esc(tp.q)}</p>${bk && bk.d.length && t.m === "t2" ? '<p class="small">Đề do thí sinh nhớ lại sau buổi thi; câu chữ có thể khác đề gốc.</p>' : bk && t.m === "t1" ? '<p class="small">Hình và bảng bên dưới do trang vẽ lại từ số liệu của đề, không phải hình gốc.</p>' : ""}</div>
      ${t.m === "t1" ? chart(bk ? bk.ds : D.ds[tk]) : ""}
      <textarea id="ta" spellcheck="false" placeholder="Viết bằng tiếng Anh tại đây…">${esc(draft)}</textarea>
      <div class="wmeta"><span id="wc">0 từ</span><span id="pace"></span></div>
      <div class="ck"><h5>Tự soát trước khi nộp</h5>${cks.map((c, i) => `<label><input type="checkbox" data-ck="${i}"> ${esc(c)}</label>`).join("")}</div>
      <div class="bar-actions"><button class="btn primary" id="sub">${PROSE.indexOf(t.k) >= 0 ? "Nộp và xem bài đang ở band nào →" : "Nộp bài viết"}</button></div><div id="fb"></div>
      ${prev.length ? `<details class="hist"><summary>Bài đã nộp (${prev.length})</summary>${prev.slice().reverse().map(p => `<div class="past"><p class="small">${new Date(p.ts).toLocaleString("vi-VN")} · ${p.words} từ · ${fmtMS(p.sec)}</p><p class="en pre">${esc(p.text)}</p></div>`).join("")}</details>` : ""}</div>`,
      byT ? `<a href="#/">Trang chính</a> › <a href="#/by/topic">Theo chủ đề</a> › <a href="#/t/${tk}">${esc(tp.n)}</a> › Viết · ${t.k}` : `<a href="#/">Trang chính</a> › <a href="#/m/${t.m}">${M.n}</a> › <a href="#/k/${(fo || t).k}">${(fo || t).k}</a> › ${fo ? "Cả bài" : "Viết"} · ${esc(tp.n)}`);
    const ta = $("#ta"), wc = $("#wc"), base = t.tpl ? words(t.tpl) : 0;
    const upd = () => { wc.textContent = Math.max(0, words(ta.value) - (ta.value.indexOf("LẬP TRƯỜNG") === 0 ? base : 0)) + " từ"; S.draft[id] = ta.value; };
    ta.oninput = upd; upd();
    act = { k: t.k, sec: 0, onTick: s => { const p = $("#pace"); if (p) { p.textContent = s > t.min * 60 ? "Đã quá " + t.min + " phút gợi ý" : "Còn " + fmtMS(t.min * 60 - s); p.className = s > t.min * 60 ? "over" : ""; } } };
    $("#sub").onclick = () => {
      const text = ta.value.trim(), n = words(text) - (text.indexOf("LẬP TRƯỜNG") === 0 ? base : 0);
      if (n < 15) { alert("Bài còn quá ngắn. Hãy viết ít nhất 15 từ rồi nộp."); return; }
      const ticked = $$("[data-ck]").filter(c => c.checked).length;
      const rec = { ts: Date.now(), sec: act ? act.sec : 0, words: n, text: text, ck: ticked };
      (S.wr[id] = S.wr[id] || []).push(rec); if (S.wr[id].length > 5) S.wr[id].shift(); delete S.draft[id]; save();
      send({ kind: "write", tech: t.k, topic: tk, type: bk ? "write:" + bk.id : fo ? "write:" + fo.k : "write", ok: ticked, try: S.wr[id].length, sec: rec.sec, words: n, text: text });
      if (act) act.sec = 0;
      if (PROSE.indexOf(t.k) >= 0) { startCoach({ m: t.m, kind: t.m === "t1" ? tk : "", scope: t.g === "FULL" ? "full" : "", q: tp.q, k0: fo ? fo.k : t.k, tk: tk, text: text }); return; }
      const ref = refModel(t, tk);
      $("#sub").remove(); ta.readOnly = true;
      $("#fb").innerHTML = `<div class="fb ok"><div class="fbh">✓ Đã nộp · ${n} từ · tự soát ${ticked}/${cks.length}</div>
        ${ref ? `<div class="b9"><span class="tag t9">${esc(ref.label)}</span><p class="en pre">${esc(ref.text)}</p></div><p class="whyp">Đặt bài của bạn cạnh bản mẫu và tìm một điểm khác nhau về ${t.g === "LR" ? "cách kết hợp từ" : t.g === "GR" ? "cấu trúc câu" : t.g === "CC" ? "cách nối câu" : "cách khai triển"}.</p>` : ""}
        <div class="bar-actions"><button class="btn" id="again">✎ Viết bài khác</button>${t.tpl ? "" : `<button class="btn" id="toc">Phân tích và nâng cấp bài này →</button>`}<a class="btn primary" href="${back}">${byT ? "Về chủ đề " + esc(tp.n) : "Về " + t.k} →</a></div></div>`;
      $("#again").onclick = () => vWrite(k, tk, via, bk);
      if ($("#toc")) $("#toc").onclick = () => startCoach({ m: t.m, kind: t.m === "t1" ? tk : "", q: tp.q, k0: t.k, tk: tk, text: text });
      fbMount($("#fb"), { tech: t.k, topic: tk, src: "write" });
      $("#fb").scrollIntoView({ behavior: "smooth", block: "nearest" });
    };
  }

  /* ---------- lộ trình giờ học ---------- */
  function vPlan() {
    const total = totalSec(), T = CFG.targetHours;
    let h = `<h1 class="pt">Lộ trình giờ học</h1><div class="planhead"><div class="ringbox">${ring(total / (T * 3600), fmtH(total), "/ " + T + " giờ")}</div><div>
      <p><b>Vì sao là ${T} giờ?</b> Cambridge English ước tính cần khoảng 200 giờ học có hướng dẫn để đi từ một bậc CEFR lên bậc kế tiếp. Band 7 đến 8 tương ứng C1, band 8.5 đến 9 tương ứng C2, nên chặng 7 lên 9 xấp xỉ một bậc CEFR.</p>
      <p>Đây là ước lượng chung cho việc lên một bậc, không phải cam kết về điểm. Nghiên cứu về học viên luyện IELTS cho thấy mức tăng điểm rất khác nhau giữa các cá nhân, và người có điểm xuất phát cao thường tăng chậm hơn.</p>
      <p>Nhịp gợi ý: ${CFG.weeks} tuần, khoảng ${Math.round(T / CFG.weeks)} giờ mỗi tuần. Bài luyện dạng game chiếm phần nhỏ của số giờ; phần lớn thời gian nên dành cho viết và soát bài.</p></div></div><div class="phases">`;
    D.phases.forEach((ph, i) => { const goal = ph.share * T * 3600, sec = ph.ks.reduce((a, k) => a + (S.sec[k] || 0), 0);
      h += `<div class="phase"><div class="pn">${i + 1}</div><div class="pb"><h4>${esc(ph.n)} <small>${Math.round(ph.share * T)} giờ</small></h4>${bar(sec / goal)}<p class="small">${fmtH(sec)} giờ đã học · ${ph.ks.map(k => `<a href="#/k/${k}">${k}</a>`).join(" · ")}</p></div></div>`; });
    h += `</div><p class="small src">Nguồn: Cambridge English, “Guided learning hours”; IELTS, “IELTS and the CEFR”; Elder &amp; O'Loughlin (2003) và Green (2007) về mức tăng điểm IELTS. Tỉ lệ chia giờ giữa các chặng là đề xuất của nhóm soạn.</p>`;
    shell(h, `<a href="#/">Trang chính</a> › Lộ trình giờ học`);
  }

  /* ---------- tiến độ của tôi ---------- */
  function vMe() {
    let rows = "", tD = 0, tN = 0, tW = 0, tA = 0, tF = 0, tFn = 0;
    D.techs.forEach(t => { const s = techStat(t); let att = 0, f = 0, fn = 0;
      D.topics[t.m].forEach(tp => { const d = S.done[t.k + "/" + tp.k]; if (d) { att += d.n; fn++; f += d.f || 0; } });
      tD += s.done; tN += s.total; tW += s.wr; tA += att; tF += f; tFn += fn;
      rows += `<tr><td><a href="#/k/${t.k}"><span class="code sm" style="--c:${color(t)}">${t.k}</span> ${esc(t.n)}</a></td><td>${D.modules[t.m].n}</td><td>${hasGame(t) ? s.done + "/" + s.total : "–"}</td><td>${att || "–"}</td><td>${fn ? Math.round(f / fn * 100) + "%" : "–"}</td><td>${s.wr || "–"}</td><td>${fmtMS(s.sec)}</td></tr>`; });
    shell(`<h1 class="pt">Tiến độ của ${esc(U.name)}</h1><div class="kpis"><div><b>${fmtH(totalSec())}</b><span>giờ đã học</span></div><div><b>${tD}/${tN}</b><span>bài luyện đã đúng</span></div><div><b>${tFn ? Math.round(tF / tFn * 100) : 0}%</b><span>đúng ngay lần đầu</span></div><div><b>${tW}</b><span>bài viết đã nộp</span></div></div>
      <div class="tablewrap"><table class="dt wide"><tr><th>Kỹ thuật</th><th>Module</th><th>Đã đúng</th><th>Lượt làm</th><th>Đúng lần đầu</th><th>Bài viết</th><th>Thời gian</th></tr>${rows}</table></div>
      <div class="bar-actions"><button class="btn" id="exp">⬇ Tải báo cáo (.csv) để gửi giáo viên</button></div>`, `<a href="#/">Trang chính</a> › Tiến độ của tôi`);
    $("#exp").onclick = () => {
      const q = v => '"' + String(v == null ? "" : v).replace(/"/g, '""') + '"';
      const out = [["name", "class", "kind", "tech", "topic", "attempts", "correct", "first_try_ok", "words", "seconds", "time", "text"].join(",")];
      Object.keys(S.done).forEach(id => { const d = S.done[id], p = id.split("/"); out.push([U.name, U.cls, "item", p[0], p[1], d.n, d.c, d.f, "", "", new Date(d.ts).toISOString(), ""].map(q).join(",")); });
      Object.keys(S.wr).forEach(id => { const p = id.split("/"); S.wr[id].forEach(w => out.push([U.name, U.cls, "write", p[0], p[1], "", "", "", w.words, w.sec, new Date(w.ts).toISOString(), w.text].map(q).join(","))); });
      Object.keys(S.sec).forEach(k => out.push([U.name, U.cls, "time", k, "", "", "", "", "", S.sec[k], "", ""].map(q).join(",")));
      const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob(["﻿" + out.join("\n")], { type: "text/csv;charset=utf-8" })); a.download = "band79-" + slug(U.name) + ".csv"; document.body.appendChild(a); a.click(); a.remove();
    };
  }

  function vAbout() {
    const nGame = D.items.length, nWrite = D.techs.reduce((a, t) => a + D.topics[t.m].length, 0);
    shell(`<h1 class="pt">Về trang này</h1><div class="about">
      <h3>Trang này dạy gì</h3><p>${D.techs.filter(t => t.g !== "FULL").length} kỹ thuật, chia hai module Task 1 và Task 2. Mỗi kỹ thuật nhắm vào một rào cản mà nghiên cứu và phân tích bài mẫu chỉ ra ở chặng band 7 lên band 9. Trong mỗi kỹ thuật, bài luyện được chia theo chủ đề lớn của IELTS (Task 2) hoặc theo dạng đề (Task 1).</p>
      <h3>Khối lượng hiện có</h3><p>${nGame} bài luyện dạng game và ${nWrite} đề viết. Một lượt làm hết các bài game mất khoảng 4 đến 6 giờ; phần còn lại của khung giờ đến từ các đề viết và việc luyện lại.</p>
      <h3>Về nhãn “Band 7” và “Band 9”</h3><p>Các câu và bài mẫu band 9 trên trang do nhóm soạn viết, dựa trên những đặc điểm đo được khi phân tích bài mẫu của các tác giả có tên. Các câu band 7 cũng do nhóm soạn viết để minh họa lỗi điển hình. Nhãn band là ước lượng theo band descriptor công khai, không phải điểm do giám khảo IELTS chấm.</p>
      <h3>Phần “Nâng cấp bài viết” đo cái gì</h3><p>Trang đếm các đặc trưng có thể đếm được trên bài của bạn (từ nối đầu câu, từ tuyệt đối, cụm danh từ, số liệu trong overview…) và so với ngưỡng rút từ bài mẫu. Kết quả là “bài đang mang đặc trưng của band nào”, không phải điểm thi. Máy không chấm được chất lượng lập luận và không bắt hết lỗi ngữ pháp.</p>${PAID.enabled ? `<h3>Chế độ trả phí</h3><p>Chế độ miễn phí luôn bật. Nếu muốn trợ lý AI chấm riêng bài của mình, bạn gửi yêu cầu tới ${esc(PAID.email)}; phí là ${vnd(FEE)} mỗi bài. Khi dùng chế độ này, bài bạn dán được gửi tới dịch vụ AI (Claude của Anthropic) để đọc.</p>` : ""}<h3>Ngân hàng đề Task 2</h3><p>${(D.bank || []).length} đề viết cả bài, xếp theo chủ đề bằng từ khóa nên một số đề có thể nằm chưa đúng chủ đề. Đề thi 2025 và 2026 là đề do thí sinh nhớ lại, lấy từ các trang tổng hợp Onthiielts, TalkFirst, Langmaster và IELTS Fighter; IELTS không công bố đề thi, nên câu chữ và tháng thi chỉ mang tính tham khảo. Các đề còn lại lấy từ bộ bài mẫu theo chủ đề của giáo viên; trang chỉ đăng đề bài và tên nơi có bài mẫu (How to do IELTS, IELTS Vietop, IELTS Advantage, Thanh Nguyễn), không đăng lại bài mẫu.</p><h3>Đề thi Task 1 năm 2024</h3><p>${(D.bank1 || []).length} đề lấy từ bộ đề năm 2024 của giáo viên, chỉ gồm những đề đọc được đầy đủ số liệu. Hình và bảng do trang vẽ lại từ số liệu của đề, không phải hình gốc; trang không đăng bài mẫu của bộ đề đó.</p><h3>Dữ liệu Task 1</h3><p>Sáu bộ dữ liệu (Newport, Ashby và các bảng số) được dựng riêng cho trang này, không phải số liệu thật.</p>
      <h3>Dữ liệu của bạn</h3><p>${CFG.endpoint ? "Tên, lớp, kết quả từng bài, thời gian làm, bài viết bạn nộp và đánh giá, góp ý bạn gửi được chuyển về bảng theo dõi của giáo viên." : "Trang chưa nối với bảng theo dõi của giáo viên. Tiến độ chỉ lưu trên thiết bị này; bạn có thể tải báo cáo ở mục Tiến độ của tôi."}</p></div>`, `<a href="#/">Trang chính</a> › Về trang này`);
  }

  /* =================== HUẤN LUYỆN VIÊN: chẩn đoán → từng bước → tổng kết =================== */
  const PROSE = ["TR1", "TR3", "CC1", "GR3", "F2", "TA2", "TA5", "T1C", "T1M", "F1"];
  const LV = { 9: ["Band 9", "l9"], 8: ["Band 8", "l8"], 7: ["Band 7 trở xuống", "l7"] };
  const badge = l => `<span class="lv ${LV[l][1]}">${LV[l][0]}</span>`;
  const snap = a => { const lv = {}; a.checks.forEach(c => { lv[c.id] = c.lvl; }); return { n9: a.n9, n: a.n, est: a.est, lv: lv }; };
  const runC = C => D.analyse(C.text, { m: C.m, kind: C.kind, scope: C.scope, k0: C.k0 });
  const AI_ON = () => !!(PAID.enabled && CFG.endpoint && S && S.paid && S.paid.code);
  function marked(text, marks) {
    const ms = (marks || []).slice().sort((a, b) => a[0] - b[0]); let h = "", p = 0;
    ms.forEach(m => { if (m[0] < p) return; h += esc(text.slice(p, m[0])) + "<mark>" + esc(text.slice(m[0], m[1])) + "</mark>"; p = m[1]; });
    return h + esc(text.slice(p));
  }
  function exampleFor(k) { const its = D.items.filter(i => i.k === k); const a = its.find(i => typeof i.b === "string" && model(i)) || its.find(i => model(i)); return a ? { b: typeof a.b === "string" ? a.b : "", n: model(a) } : null; }
  /* gọi máy chủ của giáo viên; trả về câu trả lời (kể cả khi bị từ chối) hoặc null nếu không kết nối được */
  async function srv(payload) {
    if (!CFG.endpoint) return null;
    try { const r = await fetch(CFG.endpoint, { method: "POST", headers: { "Content-Type": "text/plain;charset=utf-8" }, body: JSON.stringify(Object.assign({ name: U.name, cls: U.cls || "", dev: dev }, payload)) }); return await r.json(); } catch (e) { return null; }
  }
  async function aiCall(payload) {
    if (!AI_ON()) return null;
    const d = await srv(Object.assign({ kind: "coach", code: S.paid.code, sid: (S.coach || {}).sid || "" }, payload));
    if (d && d.left != null) { S.paid.left = d.left; save(); }
    return d;
  }
  const AI_ERR = { "no-code": "Mã kích hoạt không còn hiệu lực.", "no-credit": "Bạn đã dùng hết số bài đã trả phí. Hãy gửi yêu cầu mua thêm.", "essay-cap": "Bài này đã dùng hết số lượt hỏi trợ lý AI.", "no-session": "Phiên chấm đã hết hạn. Hãy chấm lại từ bước chẩn đoán.", limit: "Trợ lý AI đã hết lượt trong hôm nay. Hãy thử lại vào ngày mai.", "no-key": "Giáo viên chưa bật trợ lý AI." };
  function startCoach(o) {
    const a = D.analyse(o.text, o);
    S.coach = { sid: Math.random().toString(36).slice(2, 12), m: o.m, kind: o.kind || "", scope: a.full ? "full" : "para", q: o.q || "", k0: o.k0 || "", tk: o.tk || "", text0: o.text, text: o.text, stage: "diag", i: 0, round: 1, sec: 0, skip: {}, order: [], before: snap(a) };
    save(); if (location.hash === "#/coach") route(); else location.hash = "#/coach";
  }
  function planSteps(C) {
    if (C.aiSteps && C.round === 1) { C.mode = "ai"; C.order = C.aiSteps.map((_, i) => i); }
    else { C.mode = "rule"; const xs = runC(C).checks.filter(c => c.lvl < 9); xs.sort((x, y) => (y.k === C.k0 ? 1 : 0) - (x.k === C.k0 ? 1 : 0)); C.order = xs.map(c => c.id); }
    C.i = 0; C.skip = {}; C.passed = {}; C.stage = C.order.length ? "step" : "done"; save();
  }
  const coachCrumb = C => `<a href="#/">Trang chính</a> › Nâng cấp bài viết${C && C.k0 ? " › " + C.k0 : ""}`;
  const dots = C => `<div class="dots"><span class="dot ${C.stage === "diag" ? "cur" : "ok"}">Chẩn đoán</span>${C.order.map((id, i) => `<span class="dot ${C.stage === "done" || i < C.i ? (C.skip[id] ? "sk" : "ok") : i === C.i && C.stage === "step" ? "cur" : ""}">${i + 1}</span>`).join("")}<span class="dot ${C.stage === "done" ? "cur" : ""}">Tổng kết</span></div>`;

  function vCoach() {
    const C = S.coach;
    if (!C) return coachIntake();
    act = { k: C.k0 || (C.m === "t1" ? "F1" : "F2"), sec: 0, onTick: () => { C.sec = (C.sec || 0) + 1; } };
    if (C.stage === "diag") return coachDiag(C);

  }

  function coachIntake() {
    shell(`<div class="play coach" style="--c:#1b1e3c"><div class="phead"><span class="code">7→9</span><div><h1>Nâng cấp bài viết của bạn</h1><p class="grp">Dán một đoạn hoặc cả bài. Trang sẽ chỉ ra bài đang mang đặc trưng band nào, rồi dẫn bạn sửa từng bước.</p></div></div>
      <form id="cf"><div class="seg"><label><input type="radio" name="m" value="t2" checked> Task 2</label><label><input type="radio" name="m" value="t1"> Task 1</label>
      <select id="ckind" hidden><option value="">Dạng đề…</option>${D.topics.t1.map(t => `<option value="${t.k}">${esc(t.n)}</option>`).join("")}</select></div>
      <label>Đề bài <span class="opt-l">(nên dán để ${AI_ON() ? "trợ lý AI xét bài có trả lời đúng đề không" : "bạn tiện đối chiếu"})</span><input id="cq" maxlength="600" placeholder="Some people think that …"></label>
      <label>Bài viết của bạn<textarea id="ct" spellcheck="false" placeholder="Dán hoặc viết bài tại đây. Xuống dòng giữa các đoạn."></textarea></label>
      <div class="bar-actions"><button class="btn primary" type="submit">Phân tích bài của tôi (miễn phí) →</button></div></form>${payPanel(null)}</div>`, coachCrumb());

    $$("[name=m]").forEach(r => r.onchange = () => { $("#ckind").hidden = $("[name=m]:checked").value !== "t1"; });
    $("#cf").onsubmit = e => { e.preventDefault(); const text = $("#ct").value.trim(); if (words(text) < 30) { alert("Hãy dán ít nhất 30 từ để phân tích."); return; } const m = $("[name=m]:checked").value; startCoach({ m: m, kind: m === "t1" ? $("#ckind").value : "", q: $("#cq").value.trim(), text: text }); };
  }

  function featTable(a, before) {
    const gs = []; a.checks.forEach(c => { if (gs.indexOf(c.g) < 0) gs.push(c.g); });
    return `<div class="tablewrap"><table class="dt wide feat"><tr><th>Đặc trưng</th><th>Trong bài của bạn</th>${before ? "<th>Trước</th><th>Sau</th>" : "<th>Mức</th>"}<th>Kỹ thuật</th></tr>${gs.map(g => `<tr class="gr"><td colspan="${before ? 5 : 4}" style="--c:${D.groups[g].c}">${esc(D.groups[g].n)}</td></tr>` + a.checks.filter(c => c.g === g).map(c => `<tr><td>${esc(c.name)}</td><td class="small">${esc(c.measure)}</td>${before ? `<td>${before.lv[c.id] ? badge(before.lv[c.id]) : "–"}</td>` : ""}<td>${badge(c.lvl)}</td><td><a href="#/k/${c.k}" target="_blank" rel="noopener">${c.k}</a></td></tr>`).join("")).join("")}</table></div>`;
  }
  const estLine = a => `<div class="est e${a.est}"><div class="big">${a.est === "7" ? "Band 7<small> trở xuống</small>" : "Band " + a.est}</div><div><b>${a.n9}/${a.n} đặc trưng đo được đã ở mức band 9.</b><br><span class="small">Đây là mức gần nhất theo các đặc trưng máy đếm được trên bài của bạn, không phải điểm thi. Máy không chấm được chất lượng lập luận và không bắt hết lỗi ngữ pháp.</span></div></div>`;
  const aiBlock = ai => ai ? `<div class="aibox"><span class="tag">Nhận xét của trợ lý AI</span>${ai.bands ? `<div class="aib">${["TR", "CC", "LR", "GRA"].map(k => ai.bands[k] != null ? `<span><b>${esc(ai.bands[k])}</b>${k === "TR" ? "TR/TA" : k}</span>` : "").join("")}${ai.bands.overall != null ? `<span class="ov"><b>${esc(ai.bands.overall)}</b>Ước lượng chung</span>` : ""}</div>` : ""}<p>${esc(ai.summary || "")}</p><p class="small">Ước lượng của AI theo band descriptor công khai, không phải điểm của giám khảo.</p></div>` : "";

  /* hai chế độ: miễn phí (bộ phân tích tự động) và trả phí (trợ lý AI) */
  function payPanel(C) {
    if (!PAID.enabled) return "";
    const left = S.paid ? S.paid.left : 0; let st;
    if (C && C.ai) st = `<p class="payon">✓ Bài này đang được trợ lý AI chấm.${S.paid ? " Bạn còn " + left + " bài." : ""}</p>`;
    else if (AI_ON() && C) st = `<button class="btn primary" id="useai" ${left > 0 ? "" : "disabled"}>Chấm bài này bằng trợ lý AI · dùng 1 bài (còn ${left})</button>${left > 0 ? "" : `<button class="btn" id="askpay">Yêu cầu mua thêm · ${vnd(FEE)} / bài</button>`}<div id="aiwait"></div>`;
    else if (AI_ON()) st = `<p class="payon">✓ Đã bật trả phí · còn ${left} bài. Dán bài rồi chọn chấm bằng trợ lý AI ở bước chẩn đoán.</p>`;
    else st = `<button class="btn primary" id="askpay">Yêu cầu bật chấm trả phí · ${vnd(FEE)} / bài</button><button class="btn" id="havecode">Tôi đã có mã kích hoạt</button>`;
    return `<h3 class="modes-h">Chọn cách nhận phản hồi cho bài viết</h3><div class="modes"><div class="mode free"><span class="tag">Miễn phí</span><h4>Bộ phân tích tự động</h4>
      <p class="lead">Biết ngay bài đang ở đâu và cần sửa gì trước, không tốn phí.</p>

        <li>Tô màu đúng chỗ cần sửa và dẫn bạn sửa từng bước, mỗi bước một kỹ thuật.</li>

      </ul>
      <p class="limit">Giới hạn: máy chỉ đếm được hình thức của bài. Nó không hiểu ý bạn viết và không bắt hết lỗi ngữ pháp.</p></div>
      <div class="mode pay"><span class="tag t9">Trả phí</span><h4>Trợ lý AI chấm riêng bài của bạn</h4>

        <li>Đọc lại bản sửa ở từng bước và nói rõ còn thiếu gì.</li>
        <li>Có thể chỉ ra lỗi ngữ pháp và kết hợp từ nằm ngoài danh sách của bộ tự động.</li>
      </ul>
      <p class="limit">Band là ước lượng của AI theo band descriptor công khai, không phải điểm của giám khảo. Bạn chỉ bị trừ bài khi tự bấm chấm; nếu AI lỗi, bài đó được hoàn lại.</p>
      <p class="fee"><b>${vnd(FEE)}</b> / bài</p>
      <div class="bar-actions">${st}</div><div id="paybox"></div></div></div>`;
  }
  function bindPay(C, rerender) {
    const box = $("#paybox"); if (!box) return;
    const ask = $("#askpay"), have = $("#havecode"), use = $("#useai");
    if (ask) ask.onclick = () => {
      box.innerHTML = `<form class="payform" id="pf"><h5>Yêu cầu bật chấm trả phí</h5>
        <label>Số bài muốn chấm<select id="pn">${PAID.packs.map(n => `<option value="${n}">${n} bài · ${vnd(n * FEE)}</option>`).join("")}</select></label>
        <label>Email của bạn <span class="opt-l">(để nhận mã kích hoạt)</span><input id="pe" type="email" required maxlength="120" placeholder="ban@email.com"></label>
        <label>Số điện thoại<input id="pp" type="tel" required pattern="[0-9+ .\\-]{8,16}" maxlength="16" placeholder="09xx xxx xxx" title="Nhập số điện thoại gồm 8–16 chữ số"></label>
        <p class="tot">Phí: <b id="ptot"></b> <span class="small">(${vnd(FEE)} / bài)</span></p>
        ${PAID.payNote ? `<p class="small">${esc(PAID.payNote)}</p>` : ""}
        <div class="bar-actions"><button class="btn primary" type="submit">Gửi yêu cầu tới ${esc(PAID.email)}</button></div>
        <p class="small">Yêu cầu gồm họ tên (${esc(U.name)}), email, số điện thoại, số bài và tổng phí. Giáo viên sẽ trả lời qua email và gửi mã kích hoạt sau khi nhận phí. Bạn cũng có thể tự viết email tới <b>${esc(PAID.email)}</b>.</p><div id="pmsg"></div></form>`;
      const pn = $("#pn"), tot = () => { $("#ptot").textContent = vnd(pn.value * FEE); }; pn.onchange = tot; tot();
      $("#pf").onsubmit = async e => {
        e.preventDefault(); const n = +pn.value, em = $("#pe").value.trim(), ph = $("#pp").value.trim();
        const body = `Chào cô,\n\nEm muốn bật chế độ chấm bài bằng trợ lý AI trên Band 7 → 9 Writing Lab.\n\nHọ tên trên trang: ${U.name}\nEmail: ${em}\nSố điện thoại: ${ph}\nSố bài: ${n}\nTổng phí: ${n} × ${vnd(FEE)} = ${vnd(n * FEE)}\n\nEm cảm ơn cô.`;
        const mail = "mailto:" + PAID.email + "?subject=" + encodeURIComponent("[Band 7→9] Yêu cầu bật chấm trả phí: " + U.name) + "&body=" + encodeURIComponent(body);
        const d = await srv({ kind: "payreq", essays: n, fee: FEE, email: em, phone: ph });
        $("#pmsg").innerHTML = `<div class="fb ok"><div class="fbh">${d && d.ok && d.mailed ? "✓ Đã gửi yêu cầu tới giáo viên" : "Còn một bước: gửi email cho giáo viên"}</div><p>${d && d.ok && d.mailed ? "Giáo viên đã nhận được email về yêu cầu của bạn. Nếu muốn, bạn có thể gửi thêm email từ hộp thư của mình." : "Bấm nút dưới đây để mở sẵn email trong ứng dụng thư của bạn, rồi bấm gửi."}</p><div class="bar-actions"><a class="btn ${d && d.ok && d.mailed ? "" : "primary"}" href="${esc(mail)}">Mở email gửi ${esc(PAID.email)}</a></div><details class="exd"><summary>Không mở được ứng dụng thư? Chép nội dung này</summary><p class="pre small">Gửi tới: ${esc(PAID.email)}\n\n${esc(body)}</p></details></div>`;
      };
    };
    if (have) have.onclick = () => {
      box.innerHTML = `<form class="payform" id="cdf"><label>Mã kích hoạt giáo viên đã gửi<input id="cd" maxlength="24" placeholder="W79-XXXXXXXX" autocomplete="off"></label><div class="bar-actions"><button class="btn primary" type="submit">Kích hoạt</button></div><div id="pmsg"></div></form>`;
      $("#cdf").onsubmit = async e => {
        e.preventDefault(); const code = $("#cd").value.trim().toUpperCase(); if (!code) return;
        if (!CFG.endpoint) { $("#pmsg").innerHTML = '<p class="small">Trang chưa nối với máy chủ của giáo viên nên chưa kích hoạt được mã.</p>'; return; }

        const d = await srv({ kind: "coach", mode: "check", code: code });

        else $("#pmsg").innerHTML = `<p class="small" style="color:var(--bad)">${d ? "Mã không đúng. Hãy kiểm tra lại email của giáo viên." : "Không kết nối được. Hãy thử lại."}</p>`;
      };
    };
